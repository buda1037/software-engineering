sonar.projectKey=student
sonar.projectVersion=0.2.0
sonar.python.version=3.14

sonar.scm.disabled=true
# sonar.scm.provider=git

sonar.sources=src/student

sonar.host.url=http://localhost:9000

# SonarQube Token von http://localhost:9000: MyAccount > Security
# Not stored here: sonar-scanner.py reads SONAR_TOKEN from .env

sonar.exclusions=\
.venv/**/*,\
.pytest_cache/**/*,\
.ruff_cache/**/*,\
.scannerwork/**/*,\
build/**/*,\
extras/**/*,\
log/*
