---
name: student

services:
  keycloak:
    image: dhi.io/keycloak:26.7.4-debian13
    command:
      - start
      - --hostname-strict=false
      - --import-realm
    ports:
      - "127.0.0.1:8880:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - type: bind
        source: ./realm
        target: /opt/keycloak/data/import
        read_only: true
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: tmp
      KC_BOOTSTRAP_ADMIN_PASSWORD: p
      KC_HTTP_ENABLED: true
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_DATABASE: keycloak
      KC_DB_SCHEMA: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: p
      KC_CACHE: local
      KC_HEALTH_ENABLED: true
    networks: [student-network]
    hostname: keycloak
    container_name: student-keycloak
    user: nonroot:nonroot
    cap_drop: [ALL]
    healthcheck:
      # Das Image enthält weder curl noch wget, daher /dev/tcp der Bash
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\n\r\n' >&3 &&
          read -r status <&3 && [[ $$status == *' 200 '* ]]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

volumes:
  keycloak_data:
    name: student_keycloak_data
    external: true

networks:
  student-network:
    name: student-network
