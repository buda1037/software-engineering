---
services:
  keycloak:
    image: dhi.io/keycloak:26.7.4-debian13
command:
  - start
  - --hostname-strict=false
  - --import-realm
  - --spi-admin--allowed-system-variables=KEYCLOAK_CLIENT_SECRET    ports:
      - "127.0.0.1:8880:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - type: bind
        source: ./realm
        target: /opt/keycloak/data/import
        read_only: true
    env_file:
      - ../../../.env
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: tmp
      KC_BOOTSTRAP_ADMIN_PASSWORD: p
      KC_HTTP_ENABLED: true
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_DATABASE: keycloak
      KC_DB_SCHEMA: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: p
      KC_CACHE: local
    networks: [student-network]
    hostname: keycloak
    container_name: student-keycloak
    user: nonroot:nonroot
    cap_drop: [ALL]
    restart: unless-stopped

volumes:
  keycloak_data:
    name: student_keycloak_data
    external: true

networks:
  student-network:
    name: student-network
    external: true
