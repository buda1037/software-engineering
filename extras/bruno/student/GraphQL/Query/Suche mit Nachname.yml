---
info:
  name: Suche mit Nachname
  type: graphql
  seq: 3

graphql:
  method: POST
  url: "{{graphqlUrl}}"
  body:
    query: |-
      query ($searchParameters: SearchParameters) {
        students(searchParameters: $searchParameters) {
          id
          matriculationNumber
          firstName
          lastName
          email
          studyProgram
          address {
            postalCode
            city
          }
          examResults {
            module
            grade
          }
        }
      }
    variables: |-
      {
        "searchParameters": {
          "lastName": "muster"
        }
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.data.students
      operator: isArray
    - expression: res.body.data.students
      operator: isNotEmpty

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
