---
info:
  name: Neuer Student mit existierender Email
  type: http
  seq: 3

http:
  method: POST
  url: "{{restUrl}}"
  body:
    type: json
    data: |-
      {
        "matriculation_number": "777777",
        "username": "jado1012",
        "first_name": "Jane",
        "last_name": "Doe",
        "gender": "FEMALE",
        "date_of_birth": "2005-03-14",
        "email": "max.mustermann@example.com",
        "study_program": "DATA_SCIENCE",
        "enrollment_date": "2025-10-01",
        "address": {
          "street": "Moltkestraße",
          "house_number": "30",
          "postal_code": "76133",
          "city": "Karlsruhe"
        },
        "exam_results": [
          {
            "module": "Statistik",
            "grade": 1.7,
            "ects": 6,
            "exam_date": "2026-02-10"
          }
        ]
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "422"
    - expression: res.body.detail
      operator: contains
      value: max.mustermann@example.com

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
