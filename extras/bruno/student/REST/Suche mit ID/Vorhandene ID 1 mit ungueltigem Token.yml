---
info:
  name: Vorhandene ID 1 mit ungueltigem Token
  type: http
  seq: 4

http:
  method: GET
  url: "{{restUrl}}/:id"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: id
      value: "1"
      type: path
  auth:
    type: bearer
    token: ungueltig

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "401"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
