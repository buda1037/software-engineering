[project]
name = "software-engineering"
version = "0.2.0"
description = "Results of the Software Engineering module at HKA"
readme = "README.md"
authors = [
    { name = "Abdullah Almajzoub", email = "alab1018@h-ka.de" },
    { name = "Daniel Büttner", email = "buda1037@h-ka.de" },
]
maintainers = [
    { name = "Abdullah Almajzoub", email = "alab1018@h-ka.de" },
    { name = "Daniel Büttner", email = "buda1037@h-ka.de" },
]
requires-python = ">=3.15"
keywords = [
    "Python",
    "FastAPI",
]
classifiers = [
    "Development Status :: 1 - Planning",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.15",
]
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    "fastapi>=0.162.0,<1.0.0",
    "loguru>=0.7.3,<0.8.0",
    "psycopg-binary>=3.3.6,<4.0.0",
    "psycopg-pool>=3.3.3,<4.0.0",
    "psycopg[binary,pool]>=3.3.6,<4.0.0",
    "pydantic>=2.13.5,<3.0.0",
    "sqlalchemy>=2.1.6,<3.0.0",
    "strawberry-graphql>=0.327.7,<1.0.0",
    "uvicorn>=0.54.0,<1.0.0",
]

[project.scripts]
student = "student:run"

[build-system]
requires = ["uv_build>=0.12.20,<1.0.0"]
build-backend = "uv_build"

[project.urls]
repository = "https://github.com/buda1037/software-engineering"
changelog = "https://github.com/buda1037/software-engineering/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "git-cliff>=2.14.2,<3.0.0",
    "pytest>=9.1.1,<10.0.0",
    "httpx2>=2.16.0,<3.0.0", # Required by starlette.testclient
    "python-dotenv>=1.2.4,<2.0.0",
    "httpx>=0.28.1,<0.29.0",
]
doc = [
    "mkdocs-material>=9.8.0,<10.0.0",
]
lint = [
    "pyrefly>=1.4.0,<2.0.0",
    "ruff>=0.17.3,<1.0.0",
    "ty>=0.0.92,<1.0.0",
    "yamllint>=1.38.0,<2.0.0",
]

[tool.pyrefly]
project-includes = ["src", "tests"]
python-version = "3.15"
required-version = ">=1.4.0,<2.0.0"
min-severity = "warn"
preset = "strict"

[tool.pytest]
minversion = "9.1.0"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
preview = true

[tool.ruff.lint]
select = [
    "YTT",   # flake8-2020
    "ASYNC", # flake8-async
    "S",     # flake8-bandit
    "BLE",   # flake8-blind-except
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "DTZ",   # flake8-datetimez
    "T10",   # flake8-debugger
    "EXE",   # flake8-executable
    "FA",    # flake8-future-annotations
    "INT",   # flake8-gettext
    "ISC",   # flake8-implicit-str-concat
    "LOG",   # flake8-logging
    "G",     # flake8-logging-format
    "PIE",   # flake8-pie
    "PYI",   # flake8-pyi
    "PT",    # flake8-pytest-style
    "RET",   # flake8-return
    "SIM",   # flake8-simplify
    "TC",    # flake8-type-checking
    "PTH",   # flake8-use-pathlib
    "FLY",   # flynt
    "I",     # isort
    "N",     # pep8-naming
    "PERF",  # Perflint
    "E",     # pycodestyle
    "W",     # pycodestyle (warning)
    "D",     # pydocstyle
    "F",     # Pyflakes
    "PGH",   # pygrep-hooks
    "PL",    # Pylint
    "UP",    # pyupgrade
    "FURB",  # refurb
    "RUF",   # Ruff-specific rules
    "TRY",   # tryceratops
    "FAST",  # FastAPI
    "FBT",   # flake8-boolean-trap
    "A",     # flake8-builtins
    "COM",   # flake8-commas
    "RSE",   # flake8-raise
    "SLF",   # flake8-self
    "TID",   # flake8-tidy-imports
    "ARG",   # flake8-unused-arguments
]
ignore = [
    "incorrect-blank-line-before-class",
    "multi-line-summary-second-line",
    "missing-trailing-comma",
    "no-self-use",
    "unspecified-encoding",
]

[tool.ruff.lint.isort]
case-sensitive = true
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["assert", "undocumented-public-function"]

[tool.ruff.lint.pylint]
max-statements-in-try = 7

[tool.ty.environment]
python = "./.venv"
root = ["./src", "./tests/unit"]

[tool.uv]
required-version = ">= 0.12.20"
preview-features = [
    "add-bounds",
    "audit-command",
    "centralized-project-envs",
    "check-command",
    "content-addressed-cache",
    "detect-module-conflicts",
    "format-command",
    "json-output",
    "malware-check",
    "tool-install-locks",
]
add-bounds = "major"
default-groups = "all"

[tool.uv.pip]
exclude-newer = "1 day"
extra = ["dev", "doc", "lint"]
all-extras = true

[tool.uv.build-backend]
module-name = "student"
