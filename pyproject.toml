[project]
name = "software-engineering"
version = "0.1.0"
description = "Results of the Software Engineering module at HKA"
readme = "README.md"
authors = [
    { name = "Abdullah Almajzoub", email = "alab1018@h-ka.de" },
    { name = "Daniel Büttner", email = "buda1037@h-ka.de" },
]
maintainers = [
    { name = "Abdullah Almajzoub", email = "alab1018@h-ka.de" },
    { name = "Daniel Büttner", email = "buda1037@h-ka.de" },
]
requires-python = ">=3.15"
keywords = [
    "Python",
]
classifiers = [
    "Development Status :: 1 - Planning",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.15",
]
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = []

[build-system]
requires = ["uv_build>=0.12.20,<1.0.0"]
build-backend = "uv_build"

[project.urls]
repository = "https://github.com/buda1037/software-engineering"

[dependency-groups]
dev = [
    "pytest>=9.1.0,<10.0.0",
]
lint = [
    "pyrefly>=1.4.0-dev.2,<2.0.0",
    "ty>=0.0.84,<1.0.0",
]

[tool.pyrefly]
project-includes = ["src", "tests"]
python-version = "3.15"
required-version = ">=1.4.0-dev.2,<2.0.0"
min-severity = "warn"
preset = "strict"

[tool.pytest]
minversion = "9.1.0"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ty.environment]
python = "./.venv"
root = ["./src", "./tests/unit", "./tests/integration"]

[tool.uv]
required-version = ">= 0.12.20"
preview-features = [
    "add-bounds",
    "audit-command",
    "centralized-project-envs",
    "check-command",
    "content-addressed-cache",
    "detect-module-conflicts",
    "format-command",
    "json-output",
    "malware-check",
    "tool-install-locks",
]
add-bounds = "major"
default-groups = "all"

[tool.uv.pip]
exclude-newer = "1 day"
extra = ["dev", "doc", "lint"]
all-extras = true
