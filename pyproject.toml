[project]
name = "software-engineering"
version = "0.1.0"
description = "Results of the Software Engineering module at HKA"
readme = "README.md"
authors = [
    { name = "Abdullah Almajzoub", email = "alab1018@h-ka.de" },
    { name = "Daniel Büttner", email = "buda1037@h-ka.de" },
]
maintainers = [
    { name = "Abdullah Almajzoub", email = "alab1018@h-ka.de" },
    { name = "Daniel Büttner", email = "buda1037@h-ka.de" },
]
requires-python = ">=3.15"
keywords = [
    "Python",
]
classifiers = [
    "Development Status :: 1 - Planning",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.15",
]
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = []

[project.scripts]
hello-world = "hello_world:main"

[build-system]
requires = ["uv_build>=0.12.20,<1.0.0"]
build-backend = "uv_build"

[project.urls]
repository = "https://github.com/buda1037/software-engineering"
changelog = "https://github.com/buda1037/software-engineering/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "commitizen>=4.19.2,<5.0.0",
    "pytest>=9.1.0,<10.0.0",
]
lint = [
    "ruff>=0.16.9,<1.0.0",
    "ty>=0.0.84,<1.0.0",
    "yamllint>=1.38.0,<2.0.0",
]

[tool.commitizen]
name = "cz_customize"
version_provider = "uv"
tag_format = "v$version"
major_version_zero = true
update_changelog_on_bump = true
change_type_order = [
    "BREAKING CHANGE",
    "Features",
    "Bug Fixes",
    "Refactoring",
    "Code Style",
    "Tests",
    "Documentation",
    "Build System",
    "CI",
    "Chores",
]

[tool.commitizen.change_type_map]
feat = "Features"
fix = "Bug Fixes"
refactor = "Refactoring"
style = "Code Style"
test = "Tests"
docs = "Documentation"
build = "Build System"
ci = "CI"
chore = "Chores"

[tool.commitizen.customize]
commit_parser = '^((?P<change_type>feat|fix|refactor|style|test|docs|build|ci|chore|BREAKING CHANGE)(?:\((?P<scope>[^()\r\n]*)\)|\()?(?P<breaking>!)?|\w+!):\s(?P<message>.*)?'

[tool.pytest]
minversion = "9.1.0"
pythonpath = ["src"]
testpaths = ["tests/unit/hello_world"]

[tool.ruff]
preview = true

[tool.ruff.lint]
select = [
    "YTT",   # flake8-2020
    "ASYNC", # flake8-async
    "S",     # flake8-bandit
    "BLE",   # flake8-blind-except
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "DTZ",   # flake8-datetimez
    "T10",   # flake8-debugger
    "EXE",   # flake8-executable
    "FA",    # flake8-future-annotations
    "INT",   # flake8-gettext
    "ISC",   # flake8-implicit-str-concat
    "LOG",   # flake8-logging
    "G",     # flake8-logging-format
    "PIE",   # flake8-pie
    "PYI",   # flake8-pyi
    "PT",    # flake8-pytest-style
    "RET",   # flake8-return
    "SIM",   # flake8-simplify
    "TC",    # flake8-type-checking
    "PTH",   # flake8-use-pathlib
    "FLY",   # flynt
    "I",     # isort
    "N",     # pep8-naming
    "PERF",  # Perflint
    "E",     # pycodestyle
    "W",     # pycodestyle (warning)
    "D",     # pydocstyle
    "F",     # Pyflakes
    "PGH",   # pygrep-hooks
    "PL",    # Pylint
    "UP",    # pyupgrade
    "FURB",  # refurb
    "RUF",   # Ruff-specific rules
    "TRY",   # tryceratops
    "FAST",  # FastAPI
    "FBT",   # flake8-boolean-trap
    "A",     # flake8-builtins
    "COM",   # flake8-commas
    "RSE",   # flake8-raise
    "SLF",   # flake8-self
    "TID",   # flake8-tidy-imports
    "ARG",   # flake8-unused-arguments
]
ignore = [
    "incorrect-blank-line-before-class",
    "multi-line-summary-second-line",
    "missing-trailing-comma",
    "no-self-use",
    "unspecified-encoding",
]

[tool.ruff.lint.isort]
case-sensitive = true
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["assert", "undocumented-public-function"]

[tool.ruff.lint.pylint]
max-statements-in-try = 7

[tool.ty.environment]
python = "./.venv"
root = ["./src", "./tests/unit"]

[tool.uv]
required-version = ">= 0.12.20"
preview-features = [
    "add-bounds",
    "audit-command",
    "centralized-project-envs",
    "check-command",
    "content-addressed-cache",
    "detect-module-conflicts",
    "format-command",
    "json-output",
    "malware-check",
    "tool-install-locks",
]
add-bounds = "major"
default-groups = "all"

[tool.uv.build-backend]
module-name = "hello_world"
